<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 980" width="1600" height="980">
  <defs>
    <linearGradient id="stage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b0818"/>
      <stop offset="1" stop-color="#070312"/>
    </linearGradient>
    <linearGradient id="bannerP" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7b2ff7"/><stop offset="1" stop-color="#3a1a7a"/>
    </linearGradient>
    <linearGradient id="bannerG" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1f8a4c"/><stop offset="1" stop-color="#136036"/>
    </linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff9f0a"/><stop offset="1" stop-color="#ff375f"/>
    </linearGradient>
    <filter id="goldGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="980" fill="url(#stage)"/>
  <!-- background micro grid -->
  <g stroke="#191630" stroke-width="1">
    <path d="M0 40H1600M0 120H1600M0 200H1600M0 280H1600M0 360H1600M0 440H1600M0 520H1600M0 600H1600M0 680H1600M0 760H1600M0 840H1600M0 920H1600"/>
    <path d="M80 0V980M160 0V980M240 0V980M320 0V980M400 0V980M480 0V980M560 0V980M640 0V980M720 0V980M800 0V980M880 0V980M960 0V980M1040 0V980M1120 0V980M1200 0V980M1280 0V980M1360 0V980M1440 0V980M1520 0V980"/>
  </g>

  <!-- header -->
  <text x="60" y="62" fill="#e9edff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="34" font-weight="800">律动跑酷 · UI 版式规范 v1</text>
  <text x="60" y="96" fill="#8a86a8" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17">TV 优先 · 主设计基准 1920×1080 @1x · 规格标注稿（评审用，不进引擎）</text>
  <rect x="1150" y="40" width="390" height="42" rx="21" fill="#1b1830" stroke="#ffd60a" stroke-width="1.5"/>
  <text x="1345" y="67" fill="#ffd60a" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="700" text-anchor="middle">SPEC ONLY · 图内文字仅标注</text>
  <line x1="60" y1="120" x2="1540" y2="120" stroke="#2f2b45" stroke-width="1.5"/>

  <!-- ============ TV SCREEN FRAME ============ -->
  <text x="60" y="146" fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700">① 栅格 / 安全区　1920×1080 → 缩放 0.49</text>

  <!-- device bezel -->
  <rect x="60" y="150" width="940" height="540" rx="10" fill="#0d0a1c" stroke="#3a3558" stroke-width="2"/>
  <!-- overscan (cropped) zone -->
  <rect x="60" y="150" width="940" height="540" rx="10" fill="#ff375f" fill-opacity="0.075"/>
  <rect x="107" y="178" width="846" height="484" fill="#0f0c20"/>

  <!-- 12 columns -->
  <g fill="#7df0ff" fill-opacity="0.055">
    <rect x="107" y="178" width="59.5" height="484"/>
    <rect x="178.5" y="178" width="59.5" height="484"/>
    <rect x="250" y="178" width="59.5" height="484"/>
    <rect x="321.5" y="178" width="59.5" height="484"/>
    <rect x="393" y="178" width="59.5" height="484"/>
    <rect x="464.5" y="178" width="59.5" height="484"/>
    <rect x="536" y="178" width="59.5" height="484"/>
    <rect x="607.5" y="178" width="59.5" height="484"/>
    <rect x="679" y="178" width="59.5" height="484"/>
    <rect x="750.5" y="178" width="59.5" height="484"/>
    <rect x="822" y="178" width="59.5" height="484"/>
    <rect x="893.5" y="178" width="59.5" height="484"/>
  </g>
  <!-- column ruler at bottom of content-safe area -->
  <rect x="107" y="612" width="846" height="24" fill="#171331" fill-opacity="0.9"/>
  <g fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700" text-anchor="middle">
    <text x="136.75" y="628">1</text><text x="208.25" y="628">2</text><text x="279.75" y="628">3</text>
    <text x="351.25" y="628">4</text><text x="422.75" y="628">5</text><text x="494.25" y="628">6</text>
    <text x="565.75" y="628">7</text><text x="637.25" y="628">8</text><text x="708.75" y="628">9</text>
    <text x="780.25" y="628">10</text><text x="851.75" y="628">11</text><text x="923.25" y="628">12</text>
  </g>

  <!-- content-safe frame -->
  <rect x="107" y="178" width="846" height="484" fill="none" stroke="#7df0ff" stroke-width="2"/>
  <rect x="107" y="178" width="846" height="18" fill="#7df0ff" fill-opacity="0.16"/>
  <text x="117" y="192" fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700">内容安全区 1728 × 968u　（overscan 96 / 56u）</text>

  <!-- title-safe frame -->
  <rect x="130" y="212" width="800" height="436" fill="none" stroke="#ffd60a" stroke-width="1.5" stroke-dasharray="9 6"/>
  <text x="140" y="228" fill="#ffd60a" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" font-weight="700">标题安全区 1632 × 912u（144 / 84u）</text>

  <!-- sample layout blocks -->
  <rect x="130" y="240" width="800" height="34" rx="8" fill="#1c1832" stroke="#3a3558"/>
  <text x="144" y="262" fill="#a9a4c8" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="13">topbar · 顶栏（非首焦点落位）</text>
  <circle cx="900" cy="257" r="8" fill="#34c759"/>

  <!-- left 8 cols: poster wall -->
  <text x="140" y="296" fill="#8a86a8" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11">左 8 列 · 关卡海报墙</text>
  <g>
    <rect x="130" y="306" width="106" height="106" rx="12" fill="url(#hero)"/>
    <rect x="246" y="306" width="106" height="106" rx="12" fill="#1c2a5e"/>
    <rect x="362" y="306" width="106" height="106" rx="12" fill="#3a1a6e"/>
    <rect x="478" y="306" width="106" height="106" rx="12" fill="#123f52"/>
    <rect x="594" y="306" width="106" height="106" rx="12" fill="#4a2030"/>
    <text x="183" y="366" fill="#ffffff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="800" text-anchor="middle">LV1</text>
    <text x="299" y="366" fill="#c7d6ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="800" text-anchor="middle">LV2</text>
    <text x="415" y="366" fill="#e2c7ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="800" text-anchor="middle">LV3</text>
    <text x="531" y="366" fill="#bfefff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="21" font-weight="800" text-anchor="middle">LV4</text>
    <text x="647" y="366" fill="#ffc9d4" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="17" font-weight="800" text-anchor="middle">BONUS</text>
  </g>

  <!-- right 4 cols: unified banners -->
  <text x="712" y="296" fill="#8a86a8" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11">右 4 列 · 统一 .banner 规格</text>
  <rect x="712" y="306" width="218" height="52" rx="14" fill="url(#bannerP)"/>
  <text x="726" y="338" fill="#ffffff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">竞技房间大厅</text>
  <rect x="712" y="366" width="218" height="52" rx="14" fill="url(#bannerG)"/>
  <text x="726" y="398" fill="#ffffff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">今日挑战</text>
  <rect x="712" y="426" width="218" height="52" rx="14" fill="#232040" stroke="#3a3558"/>
  <text x="726" y="458" fill="#c8c4e0" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="16" font-weight="700">影子挑战</text>
  <text x="712" y="500" fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11">三条同 padding 20/28u · gap 20u · radius 24u</text>

  <!-- bottom content-bar marker -->
  <rect x="130" y="530" width="800" height="76" rx="10" fill="#171331" stroke="#2f2b45"/>
  <rect x="177" y="530" width="705" height="76" rx="10" fill="none" stroke="#ffd60a" stroke-width="1" stroke-dasharray="5 5"/>
  <text x="190" y="558" fill="#ffd60a" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" font-weight="700">信息型屏内容栏 1440u 居中</text>
  <text x="190" y="582" fill="#8a86a8" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11">沉浸型屏（游戏 HUD / 过场 / PK 分屏）用满 1728u</text>

  <!-- safe dimension callouts -->
  <g stroke="#ff375f" stroke-width="1.5">
    <line x1="60" y1="700" x2="107" y2="700"/><line x1="60" y1="694" x2="60" y2="706"/><line x1="107" y1="694" x2="107" y2="706"/>
    <line x1="953" y1="700" x2="1000" y2="700"/><line x1="953" y1="694" x2="953" y2="706"/><line x1="1000" y1="694" x2="1000" y2="706"/>
  </g>
  <text x="83" y="720" fill="#ff8fa3" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle">96u</text>
  <text x="976" y="720" fill="#ff8fa3" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" text-anchor="middle">96u</text>
  <text x="530" y="720" fill="#ff8fa3" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" text-anchor="middle">粉区 = TV overscan 会被裁掉，禁止放任何可交互元素</text>

  <!-- ============ TYPE SCALE ============ -->
  <text x="1030" y="146" fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700">② 字号阶梯（TV-1080 @1920）</text>
  <rect x="1030" y="158" width="510" height="504" rx="12" fill="#0f0c20" stroke="#2f2b45"/>
  <g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif">
    <text x="1050" y="196" fill="#e9edff" font-size="31" font-weight="800">标题 Aa 56</text>
    <text x="1050" y="214" fill="#8a86a8" font-size="12">T1 标题　56u / 1.15 / 800</text>
    <line x1="1050" y1="226" x2="1520" y2="226" stroke="#2f2b45"/>

    <text x="1050" y="266" fill="#e9edff" font-size="24" font-weight="700">副标题 Aa 36</text>
    <text x="1050" y="284" fill="#8a86a8" font-size="12">T2 副标题　36u / 1.25 / 700</text>
    <line x1="1050" y1="296" x2="1520" y2="296" stroke="#2f2b45"/>

    <text x="1050" y="336" fill="#e9edff" font-size="20" font-weight="600">正文 Aa 28</text>
    <text x="1050" y="354" fill="#8a86a8" font-size="12">B1 正文 / 按钮　28u / 1.40 / 600</text>
    <line x1="1050" y1="366" x2="1520" y2="366" stroke="#2f2b45"/>

    <text x="1050" y="406" fill="#c9c4e0" font-size="17" font-weight="500">辅助文案 Aa 24</text>
    <text x="1050" y="424" fill="#ffd60a" font-size="12">B2 辅助　24u / 1.40 / 500　← TV 最小可读硬下限</text>
    <line x1="1050" y1="436" x2="1520" y2="436" stroke="#2f2b45"/>

    <text x="1050" y="476" fill="#7df0ff" font-size="27" font-weight="800">12,480</text>
    <text x="1200" y="476" fill="#8a86a8" font-size="12">N 数值　40u / 1.10 / 800　tabular-nums</text>
    <line x1="1050" y1="488" x2="1520" y2="488" stroke="#2f2b45"/>

    <text x="1050" y="536" fill="#ff375f" font-size="43" font-weight="900">PERFECT</text>
    <text x="1050" y="558" fill="#8a86a8" font-size="12">D1 显示级　96u / 1.00 / 900　仅游戏 HUD</text>
    <line x1="1050" y1="570" x2="1520" y2="570" stroke="#2f2b45"/>

    <text x="1050" y="600" fill="#a9a4c8" font-size="12">TV-720：×0.667，B2 强制抬到 20u</text>
    <text x="1050" y="622" fill="#a9a4c8" font-size="12">Phone-L 844×390：28/20/16/14/22（离散档）</text>
    <text x="1050" y="644" fill="#ff8fa3" font-size="12">TV 与手机字号不按 --s 等比缩（观看距离不同）</text>
  </g>

  <!-- ============ LAYERS + FOCUS ============ -->
  <line x1="60" y1="744" x2="1540" y2="744" stroke="#2f2b45" stroke-width="1.5"/>
  <text x="60" y="776" fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700">③ 五层层级 / z-index</text>
  <g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12">
    <rect x="60" y="790" width="470" height="30" rx="6" fill="#171331" stroke="#2f2b45"/>
    <text x="74" y="810" fill="#a9a4c8">L0 背景 · Three.js 画布 / 氛围光</text><text x="510" y="810" fill="#7df0ff" text-anchor="end">z 0</text>
    <rect x="60" y="824" width="470" height="30" rx="6" fill="#1c2140" stroke="#2f2b45"/>
    <text x="74" y="844" fill="#cdd6ff">L1 内容 · 卡片 / 列表 / HUD 常驻</text><text x="510" y="844" fill="#7df0ff" text-anchor="end">10–29</text>
    <rect x="60" y="858" width="470" height="30" rx="6" fill="#22204a" stroke="#2f2b45"/>
    <text x="74" y="878" fill="#d7d0ff">L2 浮层 · Toast / TV 提示条 / 下拉</text><text x="510" y="878" fill="#7df0ff" text-anchor="end">30–49</text>
    <rect x="60" y="892" width="470" height="30" rx="6" fill="#3a2350" stroke="#7b2ff7"/>
    <text x="74" y="912" fill="#eadcff">L3 弹窗 · 全屏拦截 + 困焦点</text><text x="510" y="912" fill="#c7a4ff" text-anchor="end">50–69</text>
    <rect x="60" y="926" width="470" height="30" rx="6" fill="#4a1f38" stroke="#ff375f"/>
    <text x="74" y="946" fill="#ffd4de">L4 引导 / 过场 · 禁输入</text><text x="510" y="946" fill="#ff8fa3" text-anchor="end">80–99</text>
  </g>

  <!-- focus ring specimen -->
  <text x="1030" y="776" fill="#7df0ff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="15" font-weight="700">④ TV 焦点环 / 状态矩阵</text>
  <rect x="1030" y="790" width="510" height="166" rx="12" fill="#0f0c20" stroke="#2f2b45"/>
  <g filter="url(#goldGlow)">
    <rect x="1070" y="822" width="220" height="56" rx="28" fill="none" stroke="#ffffff" stroke-width="4"/>
    <rect x="1062" y="814" width="236" height="72" rx="36" fill="none" stroke="#ffb020" stroke-width="12"/>
  </g>
  <rect x="1074" y="826" width="212" height="48" rx="24" fill="#0071e3"/>
  <text x="1180" y="857" fill="#ffffff" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="19" font-weight="700" text-anchor="middle">开始挑战</text>
  <g font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="12" fill="#a9a4c8">
    <text x="1320" y="826">白内环 4u · 金外环 12u</text>
    <text x="1320" y="848">光晕 48u · scale 1.04</text>
    <text x="1320" y="870">--focus-gold #ffb020</text>
    <text x="1320" y="892">焦点目标 ≥120×64u</text>
    <text x="1320" y="914">相邻间距 ≥24u</text>
    <text x="1320" y="936">触屏命中 ≥88×88</text>
  </g>
  <text x="1050" y="906" fill="#8a86a8" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11">五态：常态 n / 按下 p / 禁用 d / 选中 s / 焦点 f</text>

  <!-- footer -->
  <text x="1540" y="976" fill="#5f5b7d" font-family="-apple-system,PingFang SC,Microsoft YaHei,sans-serif" font-size="11" text-anchor="end">ui-layout-spec@v1 · 2026-11-26 · 银橙AI</text>
</svg>
