name: TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9（AGP 8.5.2 需要 >= 8.7），免 wrapper 入库
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 稳定签名：keystore 缓存在 CI（无任何密钥入库）。
      # 首次运行生成，之后复用 → 每次出包签名一致，电视可直接覆盖安装升级。
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: happyrun-tv-keystore-v1

      - name: Prepare signing keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HappyRun TV, O=HappyRun, C=CN"
          fi

      - name: Build release APK
        working-directory: tv-app
        run: gradle :app:assembleRelease --no-daemon

      - name: Read version
        id: ver
        run: |
          VN=$(grep -oP 'versionName = "\K[^"]+' tv-app/app/build.gradle.kts)
          echo "name=$VN" >> "$GITHUB_OUTPUT"

      # 每个版本一个 Release：tag = v<versionName>，下载地址跟版本走。
      # 最新版直链（自动指向最新 Release）：releases/latest/download/app-release.apk
      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          name: TV APK v${{ steps.ver.outputs.name }}
          make_latest: true
          files: tv-app/app/build/outputs/apk/release/app-release.apk
          body: |
            律动跑酷 TV 版 v${{ steps.ver.outputs.name }}（WebView 壳，游戏加载线上地址，更新无需重装）。

            ## 下载
            - `app-release.apk`：U 盘拷到电视「文件管理器」安装，或 `adb install app-release.apk`
            - 历史版本在 Releases 页按版本挑选
            - 详细安装/遥控器操作步骤见仓库 `tv-app/README.md`

            更新内容见 tag 对应的提交历史。

      # 迁移清理：删掉旧的滚动发布 tag `tv-apk`（Release 版本化后无用）。幂等，不存在即跳过。
      - name: Retire legacy rolling release (tv-apk)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release delete tv-apk --yes --cleanup-tag 2>/dev/null || true
