name: TV APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'tv-app/**'
      - '.github/workflows/tv-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Gradle 8.9（AGP 8.5.2 需要 >= 8.7），免 wrapper 入库
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # 稳定签名：keystore 缓存在 CI（无任何密钥入库）。
      # 首次运行生成，之后复用 → 每次出包签名一致，电视可直接覆盖安装升级。
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: happyrun-tv-keystore-v1

      - name: Prepare signing keystore
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/debug.keystore ]; then
            keytool -genkeypair -keystore ~/.android/debug.keystore \
              -alias androiddebugkey -storepass android -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=HappyRun TV, O=HappyRun, C=CN"
          fi

      - name: Build release APK
        working-directory: tv-app
        run: gradle :app:assembleRelease --no-daemon

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tv-apk
          name: TV APK
          files: tv-app/app/build/outputs/apk/release/app-release.apk
          body: |
            律动跑酷 TV 版（WebView 壳，游戏加载线上地址，更新无需重装）。
            安装：U 盘拷到电视「文件管理器」安装，或 adb install app-release.apk。
            详细步骤见仓库 tv-app/README.md。
